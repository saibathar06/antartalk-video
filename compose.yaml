services:
  video:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:8080:8080'
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:8080/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3
